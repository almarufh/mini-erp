services:
  postgres:
    container_name: db-erp
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '2354:5432'
    volumes:
      - postgres:/var/lib/postgresql/18/docker
    networks:
      - app-postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  server-backend:
    container_name: erp-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'

    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-postgres
      - app-nginx

  server-frontend:
    container_name: erp-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server-backend
    networks:
      - app-nginx

volumes:
  postgres:

networks:
  app-postgres:
    driver: bridge
  app-nginx:
    driver: bridge
